<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMI Calculator(not login)</title>
    <link th:href="@{'https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css'}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .bmi-con{
            font-family: Arial, sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 125px);
            margin: 0;
        }
        .bmi-container {
            background-color: rgba(25, 9, 16, 0.7);
            color: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 60vh;
            text-align: center;
            height: 67vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }
        h2 {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            text-align: left;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            border-color: #3f51b5;
            outline: none;
        }
        #bmiButton {
            margin-top: 25px;
            padding: 12px 0;
            width: 100%;
            background: #3f51b5;
            border: none;
            color: white;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #bmiButton:hover {
            background: #303f9f;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: antiquewhite;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/session.css}">
</head>
<body>

<!--     NavBar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: transparent;">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/welcome}">Fitness Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/welcome}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" style="color: white" th:href="@{/session/start}">New Sessions</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/bmiNotlogin}">BMI</a></li>
            </ul>

            <form th:action="@{/auth}" method="get">
                <button type="submit" class="btn btn-outline-light">Login / Register</button>
            </form>
        </div>
    </div>
</nav>

<div class="bmi-con">
    <div class="bmi-container" role="main" aria-label="BMI Calculator">
        <h2>Body Mass Index (BMI) Calculator</h2>
        <form id="bmiForm" aria-describedby="bmi-desc">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" min="1" step="any" required aria-required="true" />

            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" min="30" step="any" required aria-required="true" />

            <button id="bmiButton" type="submit">Calculate BMI</button>
        </form>

        <div id="result" class="result" aria-live="polite" aria-atomic="true"></div>
    </div>
</div>

<!-- Footer -->
<footer class="py-2">
    <p class="text-light text-center small mb-0">&copy; 2025 Fitness Tracker Project - Prathamesh Lodekar</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('bmiForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const weight = parseFloat(document.getElementById('weight').value);
        const heightCm = parseFloat(document.getElementById('height').value);

        if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
            document.getElementById('result').textContent = 'Please enter valid positive numbers for weight and height.';
            return;
        }

        // Convert height to meters
        const heightM = heightCm / 100;
        // BMI formula: weight (kg) / height (m)^2
        const bmi = weight / (heightM * heightM);

        let category = '';

        if (bmi < 18.5) category = 'Underweight';
        else if (bmi < 24.9) category = 'Normal weight';
        else if (bmi < 29.9) category = 'Overweight';
        else category = 'Obese';

        document.getElementById('result').textContent =
            `Your BMI is ${bmi.toFixed(1)} (${category}).`;

    });
</script>
</body>
</html>
