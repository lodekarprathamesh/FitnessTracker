<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fragment</title>
    <title>Fragment</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/session.css}">
</head>
<body>

<!--    NavBar fragment-->
    <div th:fragment="navbar">
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(33, 37, 41, 0.6);">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/home}">Fitness Tracker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon" id="toggle-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" th:href="@{/home}">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" style="color: white" th:href="@{/prevsession}">Sessions</a></li>
                        <li class="nav-item"><a class="nav-link active" th:href="@{/bmi}">BMI</a></li>
                        <li class="nav-item"><a class="nav-link active" th:href="@{/AskAi}" >Ask Ai</a></li>
                    </ul>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light">Logout</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
