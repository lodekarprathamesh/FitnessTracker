<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fragment</title>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">-->
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/session.css">
</head>
<body>
<!--     NavBar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: transparent;">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">Fitness Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" style="color: white" th:href="@{/prevsession}">Sessions</a></li>

                <li class="nav-item"><a class="nav-link active" th:href="@{/bmi}">BMI</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/AskAi}" >Ask Ai</a></li>
            </ul>
            <form th:action="@{/logout}" method="post">
                <button id="logoutBtn" type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

    <div class="d-flex flex-column justify-content-between text-white text-center" style="height: calc(100vh - 88px); background-color: transparent;">

        <!-- Centered Main Content -->
        <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
            <h1 id="heading" class="display-4 fw-bold">Welcome to Fitness Tracker</h1>
            <p id="motivate" class="lead fst-italic">A little progress each day adds up to big results. - Satya Nani</p>

            <!-- Start New Session Button -->

                <form th:action="@{/session/start}" method="POST">
                    <button class="btn btn-outline-light mt-3" type="submit">New Session</button>
                </form>

<!--            <a th:href="@{/session/start}" class="btn btn-primary btn-lg mt-3">New Session</a>-->
        </div>

        <!-- Footer -->
        <footer class="py-2">
            <p class="text-light small mb-0">&copy; 2025 Fitness Tracker Project - Prathamesh Lodekar</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/toggle.js"></script>

</body>
</html>
