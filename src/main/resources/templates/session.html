<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/session.css">
    <style>
        .exercise-header {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.25rem;
            margin-bottom: 10px;
            text-transform: capitalize;
        }
    </style>
</head>
<body class="bg-light">

<!--NavBar-->
<div th:replace="~{fragment::navbar}"></div>

<div class="d-flex flex-column justify-content-between text-white text-center" style="min-height: calc(100vh - 88px - 65px); background-color: transparent;">

    <!-- Centered Main Content -->

        <!-- Start New Session Button -->
        <div th:if="${!sessionStarted}" class="mb-4" style="position: relative;
    top: 40vh;">
            <form th:action="@{/session/start}" method="POST">
                <button class="btn btn-success" type="submit">Start New Session</button>
            </form>
        </div>

    <!-- Row to contain both form and workouts side by side -->
    <div id="rowOfFormAndWorkout" class="row" style="--bs-gutter-x: 0";>
        <!-- Add Workout Form -->
        <div th:if="${sessionStarted}" class="col-md-6" style="display: flex;    justify-content: center;" >
            <div class="card p-4 shadow p-3 mb-5 bg-body-tertiary rounded" id="add-workout-box" style="
       background-color: rgba(25, 9, 16,0.6);
       box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8),
                   0 0 10px rgba(255, 255, 255, 0.05);
       border: 1px solid rgba(255, 255, 255, 0.08);
     ">
                <h5 class="mb-3">Add New Workout</h5>
                <form th:action="@{/addWorkout}" th:object="${workout}" method="post">
                    <input type="hidden" name="sessionId" th:value="${sessionId}">
                    <div class="mb-3">
<!--                        <label for="name" class="form-label">Workout Name:</label>-->
<!--                        <input type="text" id="name" th:field="*{name}" class="form-control" required>-->

                        <label for="name" class="form-label">Exercise Name</label>
                        <input class="form-control" list="exerciseOptions" id="name" th:field="*{name}" placeholder="Search Exercise..." required>
                        <datalist id="exerciseOptions">

                        </datalist>

                    </div>
                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight (kg):</label>
                        <input type="text" id="weight" th:field="*{weight}" th:value="${weight == 0} ? '' : ${weight}"class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="reps" class="form-label">Reps:</label>
                        <input type="text" id="reps" th:field="*{reps}" th:value="${reps == 0} ? '' : ${reps}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Workout</button>
                </form>

                <!-- End Session Button -->
                <form th:action="@{/endSession}" method="post" class="mt-3" onsubmit="return askSessionName(this)">
                    <input type="hidden" name="sessionId" th:value="${sessionId}">
                    <input type="hidden" name="sessionName" id="sessionName">
                    <button type="submit" class="btn btn-danger">Stop Session</button>
                </form>


            </div>
        </div>

        <!-- Display Workouts by Exercise -->
        <div th:if="${#maps.size(workoutsByExercise) > 0}" id="displayDiv" class="col-md-6 shadow p-4 mb-5 bg-body-tertiary rounded" >
            <div th:text="${dateAndTime}" id="date" style="text-align: start;padding: 0;    letter-spacing: 1px;word-spacing: 15px;"></div>
            <div th:each="entry : ${workoutsByExercise}" class="mb-4">
                <div class="exercise-header" style="background-color: transparent" th:text="${entry.key}">Exercise Name</div>
                <table class="table table-striped table-dark table-bordered">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Weight (kg)</th>
                        <th>Set</th>
                        <th>Reps</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="workout, iterStat : ${entry.value}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${workout.weight}"></td>
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${workout.reps}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
    <!-- Footer -->
    <footer class="py-2" style="margin: 14px 0 ; text-align: center;
    width: 100%;">
        <p class="text-light small mb-0">&copy; 2025 Fitness Tracker Project - Prathamesh Lodekar</p>
    </footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/session.js"></script>
</body>
</html>
