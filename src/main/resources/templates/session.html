<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/session.css">
    <link rel="stylesheet" href="../css/workoutTrack.css">

</head>
<body class="sessionBody">

<!--NavBar-->
<div th:replace="~{fragment::navbar}"></div>

<div class="d-flex flex-column justify-content-between text-white text-center" style="min-height: calc(100vh - 88px - 65px); background-color: transparent;">

    <!-- Centered Main Content -->

        <!-- Start New Session Button -->
        <div th:if="${!sessionStarted}" class="mb-4" style="position: relative;
    top: 40vh;">
            <form th:action="@{/session/start}" method="POST">
                <button class="btn btn-success" type="submit">Start New Session</button>
            </form>
        </div>


    <div class="container">
        <h1>💪 Dynamic Workout Logger</h1>

            <div class="add-exercise-section">
                <input type="text" id="newExerciseName" class="exercise-input" placeholder="Enter exercise name (e.g., Bench Press, Squats)">

                <button class="add-exercise-btn" onclick="addExercise()">Add Exercise</button>
                <button id="saveBtn" class="btn btn-danger" onclick="saveSession()">Stop Session</button>
            </div>
            <input type="hidden" id="sessionId" name="sessionId" th:value="${sessionId}">
            <input type="hidden" name="sessionName" id="sessionName">

            <div id="exercisesContainer">
                <div class="empty-state">
                    No exercises added yet. Start by adding your first exercise above! 🏋️‍♂️
                </div>
            </div>



        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-number" id="totalExercises">0</span>
                <div class="stat-label">Exercises</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalSets">0</span>
                <div class="stat-label">Total Sets</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalVolume">0</span>
                <div class="stat-label">Total Volume</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="avgWeight">0</span>
                <div class="stat-label">Avg Weight</div>
            </div>
        </div>
    </div>


</div>
    <!-- Footer -->
    <footer class="py-2" style="margin: 14px 0 ; text-align: center;
    width: 100%;">
        <p class="text-light small mb-0">&copy; 2025 Fitness Tracker Project - Prathamesh Lodekar</p>
    </footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/session.js"></script>
<script src="../js/WorkoutTrack.js"></script>
<script src="../js/saveWorkout.js"></script>


</body>
</html>
