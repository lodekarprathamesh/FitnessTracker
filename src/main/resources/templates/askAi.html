<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Ask AI</title>
    <link th:href="@{'https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css'}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/ask.css}">
    <link rel="stylesheet" href="../css/session.css">
</head>
<body>
    <div th:replace="~{fragment::navbar}"></div>

    <div id="wrap-con">

        <div class="container mt-5">

            <div id="head">
                Ask Ai
            </div>

            <div id="qna-div">
                <div id="content">
                    Create a Workout Plan
                </div>

                <form  id="workout-questions-form">

                    <div class="step" data-step="1">
                        <label>What is your fitness goal?</label>
                        <select name="goal" required>
                            <option value="">Select</option>
                            <option value="build muscle">Build Muscle</option>
                            <option value="lose weight">Lose Weight</option>
                            <option value="improve endurance">Improve Endurance</option>
                        </select>
                        <button type="button" class="next">Next</button>
                    </div>

                    <div class="step hidden" data-step="2">
                        <label>What is your experience level?</label>
                        <select name="experience" required>
                            <option value="">Select</option>s
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                        <div style="display: flex">
                            <button type="button" class="prev">Previous</button>
                            <button type="button" class="next">Next</button>
                        </div>
                    </div>

                    <div class="step hidden" data-step="3">
                        <label>How many days per week can you work out?</label>
                        <input type="number" name="workout" min="1" max="8" required>

                        <div style="display: flex">
                            <button type="button" class="prev">Previous</button>
                            <button type="button" class="next">Next</button>
                        </div>
                    </div>

                    <div class="step hidden" data-step="N">
                        <div style="display: flex">
                            <button id="workoutBtn" type="submit">
                                <div class="spinner-border text-light" role="status" style="
        position: relative;
        top: -3px;
        left: -3px;display: none;">
                                    <span class="sr-only"></span>
                                </div>
                                <div id="btnText">Get Workout Plan</div>

                            </button>

                            <button type="button" class="prev">Previous</button>
                        </div>
                    </div>

                </form>
            </div>

            <div id="workout-plan-result" class="hidden-btn">
                <a th:href="@{AskAi}">
                    <button id="newPlan" class="btn btn-outline-light" type="button" >
                        New workout Plan
                    </button>
                </a>

            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="py-2">
        <p class="text-light text-center small mb-0">&copy; 2025 Fitness Tracker Project - Prathamesh Lodekar</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/session.js"></script>
<script th:src="@{../js/ask.js}"></script>

</body>
</html>
